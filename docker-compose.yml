services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: qdrant_kesehatan
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - rag_network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_kesehatan
    ports:
      - "11434:11434"   # Ollama REST API
    volumes:
      - ollama_data:/root/.ollama        # persist model agar tidak re-download tiap restart
      - ./qwen3-medis.gguf:/models/qwen3-medis.gguf:ro   # mount file GGUF dari host (read-only)
      - ./Modelfile:/models/Modelfile:ro                 # mount Modelfile dari host (read-only)
    environment:
      - OLLAMA_NUM_PARALLEL=1       # 1 request sekaligus di CPU
      - OLLAMA_MAX_LOADED_MODELS=2  # muat bge-m3 (1.1GB) & qwen3-medis (1.8GB) bersamaan agar tidak swap bolak-balik
      - OLLAMA_KEEP_ALIVE=24h       # tahan model di memori selama 24 jam agar tidak di-unload otomatis
    restart: unless-stopped
    networks:
      - rag_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamlit_kesehatan
    ports:
      - "8080:8080"   # Streamlit Web UI (Port 8080)
    volumes:
      - ./src:/app/src   # Bind mount: kode live sinkron langsung tanpa rebuild
      - ./ui:/app/ui     # Bind mount: UI live sinkron langsung
      - ./data:/app/data # Bind mount: dataset CSV untuk proses ingest
      - ./evaluasi:/app/evaluasi # Bind mount: script evaluasi
      - ./logs:/app/logs # Bind mount: log eksekusi dan checkpoint
      - "./test case:/app/test case" # Bind mount: dataset uji QA
      - "./hasil evaluasi:/app/hasil evaluasi" # Bind mount: laporan hasil evaluasi (Excel/CSV/JSON)
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - COLLECTION_NAME=artikel_kesehatan
      - OLLAMA_BASE_URL=http://ollama:11434   # arahkan ke container ollama
      - LLM_MODEL=qwen3-medis
      - LLM_EVAL_MODEL=qwen3:1.7b
      - EMBEDDING_MODEL=bge-m3
      - TOP_K_RETRIEVAL=4
      - SCORE_THRESHOLD=0.55
    depends_on:
      - qdrant
      - ollama
    restart: unless-stopped
    networks:
      - rag_network

volumes:
  ollama_data:   # named volume: model Ollama tersimpan permanen

networks:
  rag_network:
    driver: bridge
