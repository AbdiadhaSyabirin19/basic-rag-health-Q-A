services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: qdrant_kesehatan
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - rag_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamlit_kesehatan
    ports:
      - "8501:8501"   # Streamlit Web UI
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - COLLECTION_NAME=artikel_kesehatan2
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LLM_MODEL=qwen3:1.7b
      - EMBEDDING_MODEL=bge-m3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
    restart: unless-stopped
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge
